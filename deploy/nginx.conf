# Variante mit eigener Subdomain (compiler.ddbmaster.de) – dann in der .env BASE_PATH leer lassen.
# Für https://ddbmaster.de/compiler/ stattdessen nginx-unterpfad.conf verwenden.

# /etc/nginx/sites-available/compiler.ddbmaster.de
# Aktivieren:  ln -s /etc/nginx/sites-available/compiler.ddbmaster.de /etc/nginx/sites-enabled/
#              nginx -t && systemctl reload nginx
# SSL:         certbot --nginx -d compiler.ddbmaster.de

server {
    listen 80;
    listen [::]:80;
    server_name compiler.ddbmaster.de;

    # muss >= MAX_UPLOAD_MB aus der .env sein
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
