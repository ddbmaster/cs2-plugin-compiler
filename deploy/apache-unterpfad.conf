# Platzhalter: example.com durch deine eigene Domain ersetzen,
#             8085 durch den PORT aus der .env (falls geändert).
# ---------------------------------------------------------------------------
# Compiler unter https://example.com/compiler/
#
# Module einmalig aktivieren:  a2enmod proxy proxy_http headers
# Diese Zeilen in den VORHANDENEN <VirtualHost *:443>-Block von example.com
# einfügen (z. B. /etc/apache2/sites-available/000-default-le-ssl.conf). Danach:
#   apachectl configtest && systemctl reload apache2
#
# In der .env muss stehen:  BASE_PATH=/compiler
# ---------------------------------------------------------------------------

    RedirectMatch 301 ^/compiler$ /compiler/

    <Location "/compiler/">
        ProxyPass        "http://127.0.0.1:8085/compiler/"
        ProxyPassReverse "http://127.0.0.1:8085/compiler/"
        ProxyPreserveHost On
        # muss >= MAX_UPLOAD_MB aus der .env sein (Bytes)
        LimitRequestBody 26214400
        RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
        RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    </Location>
