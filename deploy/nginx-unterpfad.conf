# Platzhalter: example.com durch deine eigene Domain ersetzen,
#             8085 durch den PORT aus der .env (falls geändert).
# ---------------------------------------------------------------------------
# Compiler unter https://example.com/compiler/
#
# Diese Zeilen in den VORHANDENEN server { … }-Block von example.com einfügen
# (meist /etc/nginx/sites-available/default oder …/<deine-seite>), und zwar in
# den Block mit "listen 443 ssl". Danach:  nginx -t && systemctl reload nginx
#
# In der .env muss stehen:  BASE_PATH=/compiler
# ---------------------------------------------------------------------------

    location = /compiler {
        return 301 /compiler/;
    }

    location /compiler/ {
        # muss >= MAX_UPLOAD_MB aus der .env sein
        client_max_body_size 25m;

        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
