# Platzhalter: example.com durch deine eigene Domain ersetzen,
#             8085 durch den PORT aus der .env (falls geändert).
# Variante mit eigener Subdomain (compiler.example.com) – dann in der .env BASE_PATH leer lassen.
# Für https://example.com/compiler/ stattdessen apache-unterpfad.conf verwenden.

# /etc/apache2/sites-available/compiler.example.com.conf
# Module:      a2enmod proxy proxy_http headers remoteip
# Aktivieren:  a2ensite compiler.example.com && systemctl reload apache2
# SSL:         certbot --apache -d compiler.example.com

<VirtualHost *:80>
    ServerName compiler.example.com

    # muss >= MAX_UPLOAD_MB aus der .env sein (Bytes)
    LimitRequestBody 26214400

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    ProxyPass        / http://127.0.0.1:8085/
    ProxyPassReverse / http://127.0.0.1:8085/
</VirtualHost>
